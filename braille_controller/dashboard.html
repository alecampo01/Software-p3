<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Dashboard - Braille Interpreter</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1>Braille CNC Dashboard</h1>
                <p>Translate text to Braille and control your CNC machine</p>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Translator Panel -->
            <section class="panel translator-panel">
                <h2>1. Translation</h2>
                <div class="translator-inputs">
                    <textarea id="textInput" rows="4" placeholder="Enter text to translate here..."></textarea>
                    
                    <div class="file-upload-wrapper">
                        <span class="file-label-text">Or upload a Word document (.docx):</span>
                        <input type="file" id="fileInput" accept=".docx" class="file-input-styled">
                    </div>
                    
                    <button id="btnTranslate" class="btn-primary">Translate & Generate G-Code</button>
                    
                    <div class="translation-result">
                        <label>Braille Output:</label>
                        <textarea id="brailleOutput" rows="2" readonly placeholder="Braille will appear here..."></textarea>
                    </div>
                </div>
            </section>

            <!-- Connection Panel -->
            <section class="panel connection-panel">
                <h2>Connection</h2>
                <div class="connection-status">
                    <span id="statusIndicator" class="indicator disconnected"></span>
                    <span id="statusText">Disconnected</span>
                </div>
                <button id="btnConnect" class="btn-primary">Connect to Machine</button>
            </section>

            <!-- Jog Controls -->
            <section class="panel jog-panel">
                <h2>3. Manual Testing</h2>
                
                <div class="test-controls-group">
                    <label>Stepper Angle Test:</label>
                    <div class="angle-selector">
                        <select id="angleSelect" class="styled-select">
                            <option value="30">30°</option>
                            <option value="45">45°</option>
                            <option value="90">90°</option>
                            <option value="180">180°</option>
                            <option value="360">360°</option>
                        </select>
                    </div>

                    <div class="calibration-row">
                        <div class="calib-field">
                            <label>X mm/rev</label>
                            <input type="number" id="mmPerRevX" value="40" step="0.5" min="0.1" class="calib-input">
                        </div>
                        <div class="calib-field">
                            <label>Y mm/rev</label>
                            <input type="number" id="mmPerRevY" value="40" step="0.5" min="0.1" class="calib-input">
                        </div>
                    </div>
                    
                    <div class="jog-controls">
                        <div class="jog-row">
                            <button class="jog-btn angle-jog-btn" data-axis="Y" data-dir="1">Y+</button>
                        </div>
                        <div class="jog-row">
                            <button class="jog-btn angle-jog-btn" data-axis="X" data-dir="-1">X-</button>
                            <button class="jog-btn" data-cmd="G90 G0 X0 Y0">Home</button>
                            <button class="jog-btn angle-jog-btn" data-axis="X" data-dir="1">X+</button>
                        </div>
                        <div class="jog-row">
                            <button class="jog-btn angle-jog-btn" data-axis="Y" data-dir="-1">Y-</button>
                        </div>
                    </div>
                </div>

                <div class="z-controls" style="flex-direction: column; align-items: center; gap: 0.5rem; width: 100%;">
                    <label>Solenoid Test:</label>
                    <button class="btn-primary" id="btnTestSolenoid" style="width: 100%; background: var(--accent);">Fire Solenoid</button>
                </div>
            </section>

            <!-- G-Code Panel -->
            <section class="panel gcode-panel">
                <h2>2. Job Control</h2>
                <textarea id="gcodePreview" rows="10" readonly placeholder="G-code will appear here after translation..."></textarea>
                <div class="job-actions">
                    <button id="btnStartJob" class="btn-primary" disabled>Start Job</button>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="jobProgress"></div>
                </div>
                <p id="jobStatus" class="job-status-text">Ready</p>
            </section>
            
            <!-- Terminal -->
            <section class="panel terminal-panel">
                <h2>Terminal</h2>
                <div id="terminalOutput" class="terminal-output"></div>
                <div class="terminal-input">
                    <input type="text" id="cmdInput" placeholder="Send G-code or command...">
                    <button id="btnSendCmd" class="btn-secondary">Send</button>
                </div>
            </section>
        </main>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
